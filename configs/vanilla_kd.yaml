# Logit-only KD ablation. CBAM and feature matching are intentionally absent.
experiment:
  seed: 42
  device: auto
  deterministic: false
  output_dir: runs/vanilla_kd

data:
  root: ./data
  batch_size: 128
  num_workers: 4
  validation_size: 5000
  split_seed: 42
  randaugment: false
  download: true

teacher:
  name: resnet56
  num_classes: 100
  checkpoint: null

student:
  name: resnet20
  num_classes: 100
  initial_checkpoint: null

distillation:
  method: vanilla_logit_kd
  temperature: 4.0
  ce_weight: 0.5
  kd_weight: 0.5
  label_smoothing: 0.1
  cbam: false
  feature_loss: false

training:
  epochs: 250
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: false
  scheduler: multistep
  milestones: [150, 200]
  gamma: 0.1
  patience: 0
  grad_clip: null
