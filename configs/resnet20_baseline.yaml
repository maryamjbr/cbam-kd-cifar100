experiment:
  seed: 42
  device: auto
  deterministic: false
  output_dir: runs/resnet20_baseline

model:
  name: resnet20
  num_classes: 100

data:
  root: ./data
  batch_size: 128
  num_workers: 4
  validation_size: 5000
  split_seed: 42
  randaugment: false
  download: true

training:
  epochs: 250
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: false
  scheduler: multistep
  milestones: [150, 200]
  gamma: 0.1
  label_smoothing: 0.0
  patience: 0
  grad_clip: null
