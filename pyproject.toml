[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbam-kd-cifar100"
version = "0.1.0"
description = "Feature-based knowledge distillation with CBAM attention on CIFAR-100"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Maryam Jabbari"}]
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "numpy>=1.24",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.7", "scikit-learn>=1.3"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
